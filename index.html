<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Simpsons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <main>

        <div class="input-group flex-nowrap">
            <span class="input-group-text" id="addon-wrapping">Buscador</span>
            <input type="text" class="form-control" id="inputBuscar" placeholder="Nombre del Personaje" aria-label="Username" aria-describedby="addon-wrapping">
            <button type="button" class="btn btn-secondary-subtle" id="btnBuscar">Buscar</button>
        </div>

        <div class="row" id="rowPjSimpson">
            <p>Cargando personajes..</p>



        </div>

    <!-- Modal -->
        <div
        class="modal fade"
        id="modalPjSimpson"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
        >
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="h1ModPjSimpson"></h1>
                    </div>
                    <div class="modal-body" id="bodyPjModal">

                    </div>
                    <div class="modal-footer">
                        <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                        >
                        Cerrar
                        </button>
                    </div>
                </div>
            </div>
        </div>




    </main>






























































    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
